identify_materials_data:
  description: >
    Query the vector database with the query: '{materials_data_identifier_query}' for the materials science journal article with the doi {doi} using the RAG tool. Check whether any material chemical composition (not abbreviations) and corresponding {main_extraction_keyword} value is mentioned for the provided scientific journal article or not. If the data is provided answer 'yes' else 'no'. Try until you get the response from RAG tool. Don't return the schema only. The final answer MUST be returned as either {{"answer": "yes"}} or {{"answer": "no"}}.
  expected_output: >
    Depending on whether any material chemical composition and property is mentioned for the provided scientific journal article, output should be either {{"answer": "yes"}} or {{"answer": "no"}}.
  agent: materials_data_identifier

identify_materials_data_from_context:
  description: >
    Review the complete property candidate below and answer the query:
    '{materials_data_identifier_query}'. Return yes when at least one plausible
    article-asserted material-property fact for {main_extraction_keyword} is present and should be
    attempted by the extraction stage. This is a semantic existence gate, not
    the final extraction step. Do not require this gate to normalize formulas,
    expand one shared value across multiple current-work samples, parse complex
    compositions, or construct the final composition-property mapping. Evaluate
    facts locally: one valid target-property fact is sufficient even if nearby
    samples contain non-target properties. Apply the supplied query's article
    scope, scientific inclusion rules, and exclusions exactly. Do not use
    external knowledge.
    Complete property candidate:

    {identifier_context}
  expected_output: >
    Output exactly either {{"answer": "yes"}} or {{"answer": "no"}}.
  agent: materials_data_identifier
