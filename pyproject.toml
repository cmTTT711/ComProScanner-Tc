[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comproscanner"
version = "2026.09.06"
description = "Traceable, preset-driven material-property extraction from scientific literature"
readme = "README.md"
authors = [{ name = "Aritra Roy", email = "contact@aritraroy.live" }]
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "requests",
    "python-dotenv",
    "tqdm",
    "lxml",
    "pandas",
    "openpyxl",
    "litellm",
    "pymatgen",
    "pymupdf",
    "tabulate",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
]
[project.optional-dependencies]
pdf = ["docling"]
rag = [
    "torch",
    "transformers",
    "tokenizers",
    "sentence-transformers",
    "langchain-core",
    "chromadb",
    "langchain-chroma",
]
all = [
    "docling",
    "torch",
    "transformers",
    "tokenizers",
    "sentence-transformers",
    "langchain-core",
    "chromadb",
    "langchain-chroma",
    "pymatgen",
]
dev = ["pytest", "pytest-mock"]
test = ["pytest", "pytest-cov", "pytest-mock"]
[project.urls]
"Homepage" = "https://github.com/slimeslab/ComProScanner"
"Bug Tracker" = "https://github.com/slimeslab/ComProScanner/issues"
[project.scripts]
comproscanner = "comproscanner.cli:main"
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["comproscanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--import-mode=importlib -m 'not integration'"
cache_dir = "data/cache/pytest"
markers = [
    "integration: requires optional local services, credentials, or model weights",
]

[tool.coverage.run]
omit = [
    "/tmp/*",
    "*/_remote_module_non_scriptable.py",
    "*/site-packages/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
target-version = ["py312"]
